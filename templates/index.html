<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karra o‘yini</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
        }

        input, select, button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .danger {
            background: #dc2626;
        }

        .danger:hover {
            background: #b91c1c;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #dc2626;
            margin-top: 12px;
            text-align: center;
        }

        .success {
            color: #16a34a;
            margin-top: 12px;
            text-align: center;
        }

        .user {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
        }

        .question {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin: 30px 0;
        }

        .result {
            text-align: center;
            font-size: 20px;
            margin: 20px 0;
        }

        .level-buttons {
            display: grid;
            gap: 10px;
        }

        .small {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="loginPage" class="card">
        <h1>Karra o‘yini</h1>

        <input
            type="text"
            id="username"
            placeholder="Ism"
        >

        <input
            type="password"
            id="password"
            placeholder="Parol"
        >

        <button onclick="loginUser()">Kirish</button>

        <div id="loginError" class="error"></div>
    </div>

    <div id="levelPage" class="card hidden">
        <div class="user">
            Salom, <strong id="userName"></strong>
        </div>

        <h2>Darajani tanlang</h2>

        <div class="level-buttons">
            <button onclick="startGame('easy')">Easy</button>
            <button onclick="startGame('medium')">Medium</button>
            <button onclick="startGame('hard')">Hard</button>
        </div>

        <button class="danger" onclick="logoutUser()">Chiqish</button>

        <div id="levelError" class="error"></div>
    </div>

    <div id="gamePage" class="card hidden">
        <div class="user">
            <strong id="gameUserName"></strong>
        </div>

        <div class="stats">
            <div>
                Savol:
                <strong id="questionNumber">1</strong>/10
            </div>

            <div>
                Ball:
                <strong id="score">0</strong>
            </div>

            <div>
                Streak:
                <strong id="streak">0</strong>
            </div>
        </div>

        <div id="question" class="question">
            3 x 5 = ?
        </div>

        <input
            type="number"
            id="answer"
            placeholder="Javobni yozing"
        >

        <button onclick="sendAnswer()">Javob berish</button>

        <div id="answerMessage"></div>
    </div>

    <div id="resultPage" class="card hidden">
        <h1>O‘yin tugadi</h1>

        <div class="result">
            Ball:
            <strong id="finalScore"></strong>
        </div>

        <div class="result">
            Eng yaxshi streak:
            <strong id="finalStreak"></strong>
        </div>

        <div class="result" id="finalMessage"></div>

        <button onclick="showLevelPage()">Qayta o‘ynash</button>
    </div>

</div>

<script>
    let accessToken = localStorage.getItem("access");
    let gameId = null;
    let currentQuestion = 1;

    function showPage(page) {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("levelPage").classList.add("hidden");
        document.getElementById("gamePage").classList.add("hidden");
        document.getElementById("resultPage").classList.add("hidden");

        document.getElementById(page).classList.remove("hidden");
    }

    async function loginUser() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        document.getElementById("loginError").innerText = "";

        if (!username || !password) {
            document.getElementById("loginError").innerText =
                "Ism va parolni kiriting";
            return;
        }

        try {
            const response = await fetch("/api/login/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                document.getElementById("loginError").innerText =
                    data.error || "Kirishda xatolik";
                return;
            }

            localStorage.setItem("access", data.access);
            localStorage.setItem("refresh", data.refresh);

            accessToken = data.access;

            document.getElementById("userName").innerText =
                data.user.username;

            document.getElementById("gameUserName").innerText =
                data.user.username;

            showPage("levelPage");

        } catch (error) {
            document.getElementById("loginError").innerText =
                "Server bilan aloqa yo‘q";
        }
    }

    async function startGame(level) {
        document.getElementById("levelError").innerText = "";

        try {
            const response = await fetch("/api/game/start/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + accessToken
                },
                body: JSON.stringify({
                    level: level
                })
            });

            const data = await response.json();

            if (!response.ok) {
                document.getElementById("levelError").innerText =
                    data.error || "O‘yinni boshlashda xatolik";
                return;
            }

            gameId = data.game_id;
            currentQuestion = data.question_number;

            document.getElementById("question").innerText =
                data.question;

            document.getElementById("questionNumber").innerText =
                data.question_number;

            document.getElementById("score").innerText =
                data.score;

            document.getElementById("streak").innerText =
                data.streak;

            document.getElementById("answer").value = "";
            document.getElementById("answerMessage").innerText = "";

            showPage("gamePage");

            document.getElementById("answer").focus();

        } catch (error) {
            document.getElementById("levelError").innerText =
                "Server bilan aloqa yo‘q";
        }
    }

    async function sendAnswer() {
        const answer = document.getElementById("answer").value;

        document.getElementById("answerMessage").innerText = "";

        if (answer === "") {
            document.getElementById("answerMessage").innerText =
                "Javobni yozing";
            return;
        }

        try {
            const response = await fetch("/api/game/answer/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + accessToken
                },
                body: JSON.stringify({
                    game_id: gameId,
                    answer: Number(answer)
                })
            });

            const data = await response.json();

            if (!response.ok) {
                document.getElementById("answerMessage").innerText =
                    data.error || "Xatolik";
                return;
            }

            if (data.finished) {
                document.getElementById("finalScore").innerText =
                    data.score;

                document.getElementById("finalStreak").innerText =
                    data.best_streak;

                document.getElementById("finalMessage").innerText =
                    data.message;

                showPage("resultPage");
                return;
            }

            document.getElementById("question").innerText =
                data.question;

            document.getElementById("questionNumber").innerText =
                data.question_number;

            document.getElementById("score").innerText =
                data.score;

            document.getElementById("streak").innerText =
                data.streak;

            document.getElementById("answerMessage").innerText =
                data.message;

            if (data.correct) {
                document.getElementById("answerMessage").className =
                    "success";
            } else {
                document.getElementById("answerMessage").className =
                    "error";
            }

            document.getElementById("answer").value = "";
            document.getElementById("answer").focus();

        } catch (error) {
            document.getElementById("answerMessage").innerText =
                "Server bilan aloqa yo‘q";
        }
    }

    function showLevelPage() {
        showPage("levelPage");
    }

    function logoutUser() {
        const refresh = localStorage.getItem("refresh");

        fetch("/api/logout/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + accessToken
            },
            body: JSON.stringify({
                refresh: refresh
            })
        }).finally(() => {
            localStorage.removeItem("access");
            localStorage.removeItem("refresh");

            accessToken = null;
            gameId = null;

            showPage("loginPage");
        });
    }

    async function checkLogin() {
        if (!accessToken) {
            showPage("loginPage");
            return;
        }

        try {
            const response = await fetch("/api/me/", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + accessToken
                }
            });

            if (!response.ok) {
                localStorage.removeItem("access");
                localStorage.removeItem("refresh");
                accessToken = null;
                showPage("loginPage");
                return;
            }

            const data = await response.json();

            document.getElementById("userName").innerText =
                data.username;

            document.getElementById("gameUserName").innerText =
                data.username;

            showPage("levelPage");

        } catch (error) {
            showPage("loginPage");
        }
    }

    document.getElementById("answer").addEventListener(
        "keydown",
        function(event) {
            if (event.key === "Enter") {
                sendAnswer();
            }
        }
    );

    checkLogin();
</script>

</body>
</html>
