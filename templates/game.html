<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Karra o‘yini</title>
</head>
<body>
    <h1>Karra o‘yini</h1>

    <button onclick="startGame('easy')">Easy</button>
    <button onclick="startGame('medium')">Medium</button>
    <button onclick="startGame('hard')">Hard</button>

    <hr>

    <div id="game" style="display:none;">
        <p id="question"></p>

        <input type="number" id="answer" placeholder="Javob">
        <button onclick="sendAnswer()">Javob berish</button>

        <p id="info"></p>
        <p id="message"></p>
    </div>

    <script>
        let gameId = null;

        async function startGame(level) {
            const token = localStorage.getItem("access");

            const response = await fetch("/api/game/start/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    level: level
                })
            });

            const data = await response.json();

            if (!response.ok) {
                document.getElementById("message").textContent =
                    data.error || "O‘yin boshlanmadi";
                return;
            }

            gameId = data.game_id;

            document.getElementById("game").style.display = "block";

            showQuestion(data);
        }

        function showQuestion(data) {
            document.getElementById("question").textContent =
                data.question;

            document.getElementById("info").textContent =
                "Savol: " + data.question_number +
                " | Streak: " + data.streak +
                " | Score: " + data.score;

            document.getElementById("answer").value = "";
            document.getElementById("answer").focus();
            document.getElementById("message").textContent = "";
        }

        async function sendAnswer() {
            const token = localStorage.getItem("access");
            const answer = Number(document.getElementById("answer").value);

            if (document.getElementById("answer").value === "") {
                document.getElementById("message").textContent =
                    "Javobni kiriting";
                return;
            }

            const response = await fetch("/api/game/answer/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    game_id: gameId,
                    answer: answer
                })
            });

            const data = await response.json();

            if (!response.ok) {
                document.getElementById("message").textContent =
                    data.error || "Xatolik";
                return;
            }

            if (data.finished) {
                window.location.href = "/result/?game_id=" + gameId;
                return;
            }

            showQuestion(data);
        }
    </script>
</body>
</html>
